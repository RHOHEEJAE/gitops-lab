apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: starrocks-operator
  namespace: cicd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://starrocks.github.io/starrocks-kubernetes-operator
      chart: starrocks-operator
      targetRevision: "1.9.0"
      helm:
        valueFiles:
          - $values/data-platform/starrocks-operator/values.yaml
    - repoURL: https://github.com/RHOHEEJAE/gitops-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data-starrocks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true